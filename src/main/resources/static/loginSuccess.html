<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Login Success</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .message-wrapper {
            margin-bottom: 40px;
            position: relative;
        }

        .highlight-bg {
            background-color: rgba(255, 239, 66, 0.55); /* #ffef428b */
            width: 280px;
            height: 10px;
            position: absolute;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .message-text {
            font-size: 20px;
            position: relative;
            z-index: 1;
        }

        .sub-message {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="message-wrapper">
        <div class="highlight-bg"></div>
        <div class="message-text">[Webi] 로그인에 성공했습니다.</div>
    </div>
    <div class="sub-message">확장앱에서 바로 채팅을 시작하세요!</div>
    <div>이 창은 닫으셔도 됩니다.</div>
</div>
</body>
</html>
